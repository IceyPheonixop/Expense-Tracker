<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Rupee Expense Tracker</h1>
        </header>

        <main>
            <form id="add-expense-form">
                <h2>Add New Expense</h2>
                <div class="form-group">
                    <label for="description">Description</label>
                    <input type="text" id="description" placeholder="e.g., Coffee, Groceries" required>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="amount">Amount (₹)</label>
                        <input type="number" id="amount" placeholder="0.00" min="0.01" step="0.01" required>
                    </div>
                    <div class="form-group">
                        <label for="category">Category</label>
                        <input type="text" id="category" placeholder="e.g., Food, Transport" required>
                    </div>
                </div>
                <button type="submit" class="submit-btn">
                    Add Expense
                </button>
            </form>

            <section>
                <h2>Your Expenses</h2>

                <div class="form-group" style="margin-bottom: 1rem;">
                    <label for="category-filter">Filter by Category</label>
                    <select id="category-filter" class="filter-select">
                        <option value="all">All Categories</option>
                    </select>
                </div>

                <div class="total-display">
                    <span>Total Spends:</span>
                    <span id="total-expenses">₹0.00</span>
                </div>
                <div id="expense-list-container">
                    <div id="expense-list">
                        <p id="loading-message" class="list-message">Loading expenses...</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <div id="message-modal">
        <span id="message-text"></span>
    </div>

    <script src="script.js"></script>
</body>
</html>
